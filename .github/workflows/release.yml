name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true

      - name: Build (${{ matrix.arch }})
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd src
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -trimpath -buildvcs=false \
            -ldflags="-s -w -X vpsmgr/internal/ver.Version=${VERSION}" \
            -o "../vpsmgr-${{ matrix.arch }}" .

      - name: Verify artifact
        run: |
          file vpsmgr-${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            ./vpsmgr-${{ matrix.arch }} version
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpsmgr-${{ matrix.arch }}
          path: vpsmgr-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum vpsmgr-amd64 vpsmgr-arm64 | tee SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vpsmgr-amd64
            dist/vpsmgr-arm64
            dist/SHA256SUMS
          generate_release_notes: true
